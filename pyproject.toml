[project]
name = "ai-enterprise-knowledge-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Satya Prakash", email = "satya.prakash259@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqla-paranoid>=0.1.1",
    "sqlalchemy[asyncio]>=2.1.3",
]

[project.scripts]
ai-enterprise-knowledge-assistant = "app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="app"
